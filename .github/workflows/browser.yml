name: browser

# Opens the live demo in Chrome, checks the forms in their modals, and keeps screenshots as an artifact.
# Runs when .github/browser-kasib changes on development.
on:
  push:
    branches: [development]
    paths: ['.github/browser-kasib']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the forms of the demo in Chrome
        working-directory: tools/browser
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1 >/dev/null
          node modals.mjs
      - name: Keep the screenshots on the branch browser-shots
        if: always()
        run: |
          [ -d tools/browser/shots ] || exit 0
          cd tools/browser/shots
          git init -q -b browser-shots
          git config user.name "browser check"; git config user.email "noreply@github.com"
          git add -A && git commit -qm "Screenshots of the demo, ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" browser-shots
